name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lint
        shell: pwsh
        run: ./scripts/lint-skills.ps1

      - name: Run validation
        shell: pwsh
        run: ./scripts/validate-skills.ps1
